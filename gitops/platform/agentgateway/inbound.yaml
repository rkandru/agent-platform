# Inbound: who may use which agent (D25). Closes the kagent `trusted-proxy` gap by verifying JWTs here.
# Chain for browsers: Ingress -> oauth2-proxy (Keycloak login, pass_authorization_header) -> agw-inbound -> kagent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-api
  namespace: agentgateway-system
spec:
  parentRefs: [{ name: agw-inbound }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: kagent-controller, namespace: kagent, port: 8083 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-ui
  namespace: agentgateway-system
spec:
  parentRefs: [{ name: agw-inbound }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: kagent-ui, namespace: kagent, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-agw-inbound
  namespace: kagent
spec:
  from: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: agentgateway-system }]
  to: [{ group: "", kind: Service }]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: inbound-jwt
  namespace: agentgateway-system
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: agw-inbound }]
  traffic:
    phase: PreRouting
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://keycloak.example.com/realms/platform
          audiences: [kagent]
          jwks:
            remote:
              url: https://keycloak.example.com/realms/platform/protocol/openid-connect/certs
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: inbound-user-rate-limit
  namespace: agentgateway-system
spec:
  targetRefs: [{ group: gateway.networking.k8s.io, kind: HTTPRoute, name: kagent-api }]
  traffic:
    rateLimit:
      local:
        - requests: 120
          unit: Minutes
          key: jwt.sub
# Per-agent ACL (Deny unless caller is in the agent's audience group) is rendered into
# generated/inbound-agent-acl.yaml by tools/render_agent_policies.py from Agent CR labels.
