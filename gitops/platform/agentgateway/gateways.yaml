apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agw-inbound
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    # Browser traffic arrives from oauth2-proxy (which performs the Keycloak login and forwards
    # Authorization: Bearer <access token>). Service clients (intake, other clusters) call this directly.
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agw-egress
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes: { namespaces: { from: Same } }
