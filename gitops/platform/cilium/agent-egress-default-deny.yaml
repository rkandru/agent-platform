# Agent namespaces may only talk to DNS, agentgateway egress, Keycloak (token endpoint) and the egress proxy (D5).
# Selecting endpoints with an egress rule puts them in default-deny for everything else.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: agent-namespaces-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.cilium.k8s.namespace.labels.platform.example.com/agent-namespace: "true"
  egress:
    - toEndpoints:
        - matchLabels: { "k8s:io.kubernetes.pod.namespace": kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway-system
            gateway.networking.k8s.io/gateway-name: agw-egress
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - toFQDNs: [{ matchName: keycloak.example.com }]          # token exchange (D11); TODO: in-cluster Service if applicable
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { "k8s:io.kubernetes.pod.namespace": egress-proxy }   # allowlisted internet (D5)
      toPorts: [{ ports: [{ port: "3128", protocol: TCP }] }]
  ingress:
    - fromEndpoints:
        - matchLabels: { "k8s:io.kubernetes.pod.namespace": kagent }        # controller -> agent pods (A2A)
