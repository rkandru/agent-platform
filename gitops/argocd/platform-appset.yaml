# One Application per platform component directory.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-platform-components
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/example-org/agent-platform.git   # TODO(repo)
        revision: main
        directories:
          - path: gitops/platform/*
          - path: gitops/platform/kyverno/tests
            exclude: true
          - path: gitops/platform/guardrails/config
            exclude: true
  template:
    metadata:
      name: 'platform-{{ .path.basename }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/example-org/agent-platform.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
